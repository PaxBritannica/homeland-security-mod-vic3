 ### Academic Expedition
 ban_survey.23.t: "University Geologists Offer Assistance"
 ban_survey.23.d: "A prestigious university in [SCOPE.sCountry('country_explorers').GetName] has learned of our mineral survey in [SCOPE.sCountry('ban_target').GetName] and has dispatched a team of academic geologists eager to participate. They bring with them #yellow state-of-the-art#! equipment, the latest geological theories, and a genuine enthusiasm for scientific discovery.\n\n They propose a full data-sharing arrangement, our practical findings combined with their academic analysis could yield far more accurate results."
 ban_survey.23.f: "Science and statecraft need not be strangers."
 ban_survey.23.a: "Welcome them. Share all data openly."
 ban_survey.23.b: "We work better alone."

