 # ARM THE RADICALS
 hostile_diplo_events.1.t: "Arsenal of Revolution"
 hostile_diplo_events.1.d: "Our Secret Service has established smuggling routes into [SCOPE.sCountry('arm_radicals_operation_target').GetName]. Local radicals are prepared to act, but request additional arms and funding. With our support, they believe the regime could be challenged far sooner."
 hostile_diplo_events.1.f: "Maps dotted with contacts. Crates of rifles ready to move. Border guards already paid.\n\nOnce armed, the rebels will not hesitate. Whether the government survives or collapses, chaos will follow—and chaos serves our interests."
 hostile_diplo_events.1.a: "We must give them everything they need."
 hostile_diplo_events.1.b: "They will have to wait."
 #   |
 #   | event for target
 #   V
 hostile_diplo_events.2.t: "Gathering Unrest"
 hostile_diplo_events.2.d: "Public unrest is growing across [ROOT.GetCountry.GetName]. A recent arrest uncovered a sealed crate of #r foreign military weapons#!, indicating that outside powers may be fueling the disorder."
 hostile_diplo_events.2.f: "The confiscated crate told a clear story factory-sealed rifles, markings removed, professionally smuggled.\n\nProtests are spreading, and this time they are not merely spontaneous. Discontent is one thing. Discontent armed from abroad is another."
 hostile_diplo_events.2.a: "This is deeply concerning."
 hostile_diplo_events.2.b: "Invest in suppressing the unrest."

 # SUPPORT SLAVE ABOLITIONIST MOVEMENTS
 hostile_diplo_events.3.t: "Seeking Freedom"
 hostile_diplo_events.3.d: "Our covert support for abolitionist networks in [SCOPE.sCountry('support_slave_target_country').GetName] is accelerating the collapse of plantation control. Escapes are increasing, but liberation raises new challenges; thousands now seek shelter, work, and stability in a society unprepared to receive them. They don't have much time before the #r repression#! starts."
 hostile_diplo_events.3.f: "Our safe houses are overflowing with fugitives, families carrying forged papers, whispered directions, and little else. Word of escape spreads faster than abolitionists can guide it.\n\n Routes are strained, authorities are growing suspicious, and the newly freed move in growing numbers. Freedom has been ignited, but where it will lead remains uncertain."
 hostile_diplo_events.3.a: "They must find their place beyond the #y old order#!."
 hostile_diplo_events.3.b: "We will offer them a place #g among us#!."

 ### Pirates!!!
 hostile_diplo_events.4.t: "Aaarrgh!"
 hostile_diplo_events.4.d: "The high seas have proven most profitable! Our hired corsairs have plundered [SCOPE.sCountry('piracy_target').GetName]'s @convoys! [concept_convoys] with ruthless efficiency. Now they arrive at our ports, holds brimming with stolen goods: and they're prepared to share their ill-gotten gains for a generous cut."
 hostile_diplo_events.4.f: "The docks bustle with activity as weathered sailormen unload crate after crate of plundered cargo. The stench of saltwater mingles with exotic spices as your cut of the spoils is laid bare before you."
 hostile_diplo_events.4.a: "Honor among thieves, take our share." #1/3 dividends
 hostile_diplo_events.4.b: "Seize all the booty and arrest the pirates!" # 3/3 dividends
                            # 50% you get triple the income 50% you get the income but get a cut on merchant marine and trades throughput!
 #   |
 #   | event for target
 #   V
 hostile_diplo_events.5.t: "Shipping Routes Disrupted"
 hostile_diplo_events.5.d: "Pirates have been wreaking havoc on our merchant shipping!"
 hostile_diplo_events.5.f: "The latest reports from our port authorities paint a #r grim picture#!. Pirates have been systematically targeting our merchant vessels, causing severe disruptions to our maritime trade. The attacks seem too coordinated to be mere chance - someone must be supporting these raiders.\n\nOur @convoys! [concept_convoys] captains demand action, but catching the true culprits may prove challenging."
 hostile_diplo_events.5.a: "We will give them what they deserve."
 #   |
 #   | Piracy Journal Events for target
 #   V
 hostile_diplo_events.6.t: "Navy mobilized"
 hostile_diplo_events.6.d: "We are sending our best men to take care of the #r pirate filth#!"
 hostile_diplo_events.6.f: "The Admiralty has ordered the mobilization of our naval forces to hunt down and eliminate the pirate threat. Our ships are being dispatched to patrol the affected sea lanes, with orders to engage any pirate vessels on sight. The crews are eager for action, determined to restore safety to our waters and protect our maritime commerce."
 hostile_diplo_events.6.a: "Godspeed."
 #   |
 #   | The pirate captain is in custody
 #   V
 hostile_diplo_events.7.t: "We have captured the pirate leader"
 hostile_diplo_events.7.d: "We have successfully defeated the pirate threat and manage to capture some of them alive, including their leader who have confessed of being paid by [SCOPE.sCountry('piracy_initiator').GetName] to disrupt our maritime activities."
 hostile_diplo_events.7.f: "The last of the pirate ships have been sunk or captured. Our naval forces have restored order to the seas, and our merchant vessels can now sail without fear. The captured pirates are being interrogated to uncover any information about their backers and future plans.\n\nThe experience gained from this operation has strengthened our naval capabilities, and we are better prepared to deal with any future threats to our maritime trade."
 hostile_diplo_events.7.a: "We will retaliate."
 #   |
 #   | Pirates are disbanded and experience is gained.
 #   V
 hostile_diplo_events.8.t: "The tide has changed"
 hostile_diplo_events.8.d: "After weeks of #r bitter fighting#!, we managed to repel the pirates. Altough we were unsuccessful in capturing their leaders and gain information about the country behind them."
 hostile_diplo_events.8.f: "#g The seas are safe again#!. After months of chaos, our @convoys! [concept_convoys] convoys are sailing without fear, and the docks bustle with life once more. The merchants are already counting their coins, though it will be some time before we recover what was lost.\n\nThere are whispers, of course. Some say these 'pirates' flew no flags by accident, that foreign hands guided their blades. But whispers prove nothing, and for now, our traders care only that the routes are open and the horizon is clear."
 hostile_diplo_events.8.a: "We must remain vigilant."

 hostile_diplo_events.9.t: "Siphoning Technology breakthrough"
 hostile_diplo_events.9.d: "Our Secret Service has successfully infiltrated the researchers' ring in [SCOPE.sCountry('steal_tech_target').GetName]. With a solid foothold on their scientific community, we can now siphon their technological advancements to bolster our own nation's progress in one of the main fields."
 hostile_diplo_events.9.f: "I despised the suffocating atmosphere of those fabricated social gatherings. Months of cultivating trust through endless nights of false camaraderie finally bore fruit. \n\n Yesterday, I managed to engage one of their lead scientists in conversation about his latest project. He introduced me to his beloved wife, and we spent hours discussing their research. A few drinks were all it took to loosen his tongue and reveal more than he intended. \n\n His devotion to his wife, it seems, is matched only by his infatuation with her younger sister. Turns out the laboratory wasn't just a place of scientific discovery...\n\n Gathering evidence of his indiscretions proved surprisingly easy. Perhaps me and him could find some mutually beneficial arrangement... I'm certain his wife would find my discoveries... illuminating."
 hostile_diplo_events.9.a: "Our #y Production#! methods could use an edge."
 hostile_diplo_events.9.b: "Our #y Military#! technology could use a boost."
 hostile_diplo_events.9.c: "Our #y Society#! could benefit from new ideas."
 hostile_diplo_events.9.e: "We cannot risk exposure now."
 #   |
 #   | TECH STEAL DISCOVERED
 #   V
 hostile_diplo_events.10.t: "Arrested infiltrator"
 hostile_diplo_events.10.d: "Our intelligence services have uncovered a spy ring operating within our borders, siphoning off technological advancements to [SCOPE.sCountry('steal_tech_initiator').GetName]. The infiltrators have been arrested and are currently being interrogated."
 hostile_diplo_events.10.f: "The Ministry has announced the arrest of several individuals suspected of espionage. These infiltrators were caught red-handed attempting to smuggle sensitive technological documents out of the country. \n\n During interrogation, they revealed their connections to [SCOPE.sCountry('steal_tech_initiator').GetName] and their methods of operation. The government is taking swift action to root out any remaining spies and safeguard our technological advancements."
 hostile_diplo_events.10.a: "They will rot in jail. Surely they don't represent [SCOPE.sCountry('steal_tech_initiator').GetName] as a whole."
 hostile_diplo_events.10.c: "We must increase our counter-espionage efforts."
 hostile_diplo_events.10.b: "Denounce [SCOPE.sCountry('steal_tech_initiator').GetName] for their underhanded tactics."



 #event_first_researched_secret_service
 hms_secret_service_events.1.t: "Establishment of the Secret Service"
 hms_secret_service_events.1.d: "Recognizing the growing importance of intelligence in warfare as well as in national security, our government has decided to establish a dedicated [concept_secret_service]. This new agency will be responsible for gathering intelligence on both domestic and foreign threats, as well as protecting key government officials and infrastructure."
 hms_secret_service_events.1.f: "As the first ever Secret Service reunion start. The selected officials in the room gather around listening to your words carefully, you read their faces they cannot help but wonder. You clear your throat and start speaking. 'Gentlemen, today we embark on a new chapter in our nation's history. The establishment of the Secret Service marks a significant step forward in our commitment to safeguarding our nation and its people. Our primary focus will be to...'"
 hms_secret_service_events.1.a: "Boost our #y authority and control#! over the population."
 hms_secret_service_events.1.b: "Expand our #y foreign influence#! and interests."
 hms_secret_service_events.1.c: "Protect the #y interest#! of this very government."

 #intelligence operation uncovered by enemy
 hms_operation_uncovered.1.t: "Our Intelligence Operation has been uncovered"
 hms_operation_uncovered.1.d: "Our intelligence operatives have reported that one of our covert operations has been uncovered by [SCOPE.sCountry('operation_target').GetName]. This revelation poses a significant threat to our national security and diplomatic relations. Foreign newspapers report that our agents will be jailed and brought to justice. We are withdrawing all assets from this operation."
 hms_operation_uncovered.1.f: "As we gather around the aged wooden table, one of our operatives slides a letter across it. His face pale as a ghost. Blood stains visible on the paper. It is already cut open, a brief blurred passage of ink reads... 'They know everything' ".
 hms_operation_uncovered.1.a: "We must accept the consequences of our actions."

 hms_operation_uncovered.2.t: "Intelligence Operation against us has been uncovered"
 hms_operation_uncovered.2.d: "Our intelligence services have reported that [SCOPE.sCountry('operation_initiator').GetName] has been conducting active hostile operations against our interests. The Operation has been stopped and the spies are now in jail."
 hms_operation_uncovered.2.f: "Shadowy figures gather beneath the lamppost, voices low, eyes watchful. The police have been following them for weeks. But there's a secret they still do not know; this is no simple police buisness but an intricate webs of local interests, money and international power play."
 hms_operation_uncovered.2.a: "Such despicable tactics will not go unpunished."


 #bribe out of office popup event
 hms_resignation_events.1.t: "Pay the man and let's move on..."
 hms_resignation_events.1.d: "[SCOPE.sCharacter('resigning_politician').GetFullName] has proven to be a liability to the state and its people. [SCOPE.sCharacter('resigning_politician').GetHerHis] personality and ideologies do not belong here. To ensure a smooth transition and avoid public scrutiny, we have decided to offer [SCOPE.sCharacter('resigning_politician').GetHerHim] a substantial bribe to resign from office quietly."
 hms_resignation_events.1.f: "Every man has his price, we just need to keep adding zeros until we find it."
 hms_resignation_events.1.a: "A small price to pay for stability."
 hms_resignation_events.1.b: "On a second thought this might be too much..."
 
 # A favor for a friend... (random event that fires after establishing secret service)
 # This need to reference a specific character
 hms_resignation_events.2.t: "A Favor for a Friend..."
 hms_resignation_events.2.d: "In the shadows of our political landscape, a former official has approached us with a delicate request. This individual, once a prominent figure in our government, is now seeking our assistance to secure [SCOPE.sCharacter('resigning_politician').GetFullName]'s early retirement. They have offered a substantial bribe in exchange for our help in facilitating [SCOPE.sCharacter('resigning_politician').GetHerHis] departure without scandal or controversy. After careful consideration, we have decided to accept this offer. By aiding this former official, we not only gain valuable resources but also strengthen our network of influence within the political sphere."
 hms_resignation_events.2.f: "As we sit in a dimly lit room, the former official leans in, [SCOPE.sCharacter('resigning_politician').GetHerHis] voice barely above a whisper. [SCOPE.sCharacter('resigning_politician').GetHerHis|U] cigar is the only source of light, casting flickering shadows on the walls. 'You understand,' [SCOPE.sCharacter('resigning_politician').GetSheHe] says, 'that [SCOPE.sCharacter('resigning_politician').GetHerHis] early retirement must be handled discreetly. I trust that you will handle this with utmost care and confidentiality.'"
 hms_resignation_events.2.a: "Good friends always tend to each others' needs."
 hms_resignation_events.2.b: "We only respond to the voice of the people."

 #Journal Entries
 je_group_intelligence: "Intelligence"
 hms_je_piracy: "Deal with the pirates"
 hms_je_piracy_reason: "Recent piracy activities have been targeting our shipments and [concept_convoys], if we do not put an end to this now we will face #r serious economic consequences#!!"
 je_intelligence_privacy_completed_tt: "The pirates have stopped plundering our sea lanes."
 hms_je_piracy_bribed: "Bribe the pirates."
 hms_je_piracy_fought: "Send the navy."
 hms_je_piracy_bribed_desc: "If we pay the pirates enough, they might leave us alone, at least for a while."
 hms_je_piracy_fought_desc: "Our navy is strong enough to deal with the pirate threat head on."
 je_intelligence_privacy_on_complete_tt: "The piracy activities financed by the unknown country will cease."

 ### SABOTAGE EVENT ### BIG EXPLOSION HITS THE CITY CENTER
 ### 
 ###
 ###
 ###

 political_unrest_modifier: "Times of Political Unrest"

 sabotage_event.1.t: "Catastrophic Explosion"
 sabotage_event.1.d: "#r A devastating explosion#! has struck the capital center, claiming at least #r 10 lives and leaving dozens wounded#!. Preliminary investigations indicate this was a deliberate act of #y sabotage#! designed to cripple our nation's critical infrastructure. While the perpetrators remain unknown, authorities are investigating whether this attack stems from growing domestic extremism or represents the work of foreign operatives."
 sabotage_event.1.f: "The ground trembled as the massive detonation tore through the city's heart. Towering flames consumed nearby structures while thick columns of smoke billowed skyward, casting an ominous shadow over the capital. Emergency crews raced through debris-strewn streets, fighting the spreading fires and evacuating survivors from the wreckage. As sirens wailed through the smoke-filled air, rumors of deliberate sabotage rippled through the terrified crowds, transforming shock into suspicion and fear."
 sabotage_event.1.a: "We will not rest until those responsible are brought to justice."

 sabotage_event.2.t: "Local Journal Speculating"
 sabotage_event.2.d: "In the aftermath of the recent events, local newspapers have been making speculations about #y rogue government#! elements operating to distabilize our country in order to gain more power."
 sabotage_event.2.f: "So I ask you... Dear readers, who stands to gain from such chaos? Who benefits when our cities burn and our people live in fear? With the treat of having military patrolling our streets 24 hours a day. Is it not those who seek to consolidate power, to erode our freedoms under the guise of security? We must remain vigilant against those who would exploit tragedy for their own ends. Our nation deserves better than to be pawns in a game of political ambition."
 sabotage_event.2.a: "Leave no stone unturned."
 sabotage_event.2.b: "These are baseless conspiracies."

 police_sabotage_progress_tt: "The police gains progress in the investigations."
 radicals_sabotage_progress_tt: "The radicals gain progress in their escape."
 radicals_sabotage_progress_tt_huge: "The radicals make #r significant#! progress in their escape."

 sabotage_event.3.t: "Greater Good"
 sabotage_event.3.d: "In the wake of the recent events, some voices from the so called #y deep-state#! have suggested we could... Turn things around to our advantage. By implementing stricter control over the population and increasing surveillance, we could ensure such incidents never happen again. #r For the greater good of course...#! "
 sabotage_event.3.f: "The Director leaned forward, eyes gleaming with a mix of determination and pragmatism. \n\n 'This tragedy has been devastating. You see I am an optimist by nature... I believe that from chaos, order can emerge. It would be utterly irresponsible of us not to take this time as of essence..."
 sabotage_event.3.a: "There is only one power we can trust... Ours."
 sabotage_event.3.b: "For the greater good, right ?"

 sabotage_event.66.t: "Shaming Campaign"
 sabotage_event.66.d: "#r Radical journals#! have been targeting our #y Armed Forces#! indicating that our ranks could be responsible for what happened in the capital."
 sabotage_event.66.f: "The headlines screamed accusations, painting the army as traitors of the nation. Articles detailed alleged meetings of commanders with radical groups, suspicious financial affairs, and whispered rumors of disloyalty. The public's trust in our higher ranks begins to erode quickly as these sensational stories spread like wildfire."
 sabotage_event.66.a: "This is pure sensationalism."
 sabotage_event.66.b: "Perhaps there is some truth to it..."

 sabotage_event.4.t: "Another innocent man dead"
 sabotage_event.4.d: "We received some unsettling news about [SCOPE.sCharacter('killed_commander').GetFullName] being killed just yesterday night while he was going back to the barracks after [SCOPE.sCharacter('killed_commander').GetHerHis] leave. This is probably the fruit of days of public shaming and journal that were trying to frame [SCOPE.sCharacter('killed_commander').GetHerHis] as the culprit behind the recent explosion."
 sabotage_event.4.f: "The news hit like a thunderclap. Another innocent life lost to the frenzy of suspicion and fear gripping our city. The devout commander, a mere pawn in a larger game, had been relentlessly hounded by sensationalist media and public outrage in the last few days. His death serves as a grim reminder of the dangers of wanna-be vigilantes."
 sabotage_event.4.a: "What have we come to?"
 sabotage_event.4.b: "Here goes the #y scapegoat#! we needed."

 sabotage_event.98.t: "We found the Terrorists"
 # Would be nice to do this dynamically and IF a country actually has backed the radicals
 # It will appear here, but for now we keep it humble
 sabotage_event.98.d: "Four individuals have been arrested this morning in connection with the recent explosion in the capital. After an intense shootout in the outskirts of the city that left one terrorist dead, security forces managed to storm the building and arrest them. Preliminary interrogations indicate they are a rogue branch of [SCOPE.gsInterestGroup('reckless_mf_ig').GetNameNoFormatting]."
 sabotage_event.98.f: "The councillor burst through the doors, scattering papers and knocking over chairs, clutching a torn page from a half-burned journal. #y We found them! #! he shouted. Cheers erupted across the room. At last, the nation and its people could see the light at the end of the tunnel."
 sabotage_event.98.a: "Arrest [SCOPE.sCharacter('reckless_out_of_govt_leader').GetFullName], he's a traitor of the nation."
 sabotage_event.98.b: "Those bastards surely do not represent [SCOPE.gsInterestGroup('reckless_mf_ig').GetNameNoFormatting] entirely."

 sabotage_event.99.t: "Radicals Escaped"
 sabotage_event.99.d: "Amidst the chaos following the recent explosion, radical elements have exploited the confusion to escape justice in our country. Authorities are confirmed they managed to get away and escape to [SCOPE.sCountry('rival_country_1').GetName]."
 sabotage_event.99.f: "Our security forces were stretched thin, grappling with the immediate crisis. Seizing this opportunity, radical factions orchestrated a daring escape, slipping through the cracks of our overwhelmed defenses. As the dust settled, it became clear that these elements had vanished into the shadows, evading capture and fleeing to [SCOPE.sCountry('rival_country_1').GetName]. Their disappearance raises urgent questions about our preparedness and the need for heightened vigilance against such threats in the future."
 sabotage_event.99.a: "Publicly denounce [SCOPE.sCountry('rival_country_1').GetName]."
 sabotage_event.99.b: "If we only had a law to engage in [concept_foreign_affairs]"
 sabotage_event.99.c: "Dispatch a [concept_foreign_affairs] delegation."

 sabotage_event.5.t: "Foreign Help"
 sabotage_event.5.d: "[SCOPE.sCountry('helper_country_1').GetName] And [SCOPE.sCountry('helper_country_2').GetName] have come forward offering help for our cause."
 sabotage_event.5.f: "In the wake of the recent sabotage, envoys from [SCOPE.sCountry('helper_country_1').GetName] and [SCOPE.sCountry('helper_country_2').GetName] have arrived, bearing offers of assistance. They express solidarity with our plight and propose to share resources, expertise, and intelligence to help us uncover the truth. Their support could prove invaluable as we navigate this crisis."
 sabotage_event.5.a: "We gratefully accept [SCOPE.sCountry('helper_country_1').GetName]'s help."
 sabotage_event.5.b: "We gratefully accept [SCOPE.sCountry('helper_country_2').GetName]'s help."
 sabotage_event.5.c: "We must be cautious accepting foreign help."

 hms_resignation_events.3.t: "Longa Manus"
 hms_resignation_events.3.d: "For months, agents of the Secret Police have maintained discreet surveillance on [SCOPE.sCharacter('resigning_politician').GetFullName], following a pattern of unusual meetings, coded correspondence, and unexplained transfers of wealth. A recent search of the residence conducted while the target was absent, has yielded documents that strongly suggest coordination with representatives of a [SCOPE.sCountry('foreign_power').GetName]."
 hms_resignation_events.3.f: "In the great game of nations, the most dangerous pieces are rarely moved openly."
 hms_resignation_events.3.a: "We cannot compromise our relationship with [SCOPE.sCountry('foreign_power').GetName]."
 hms_resignation_events.3.b: "Feed him to the newspapers and denounce [SCOPE.sCountry('foreign_power').GetName]."
 hms_resignation_events.3.c: "If we only had a [concept_secret_service]..."
 hms_resignation_events.3.e: "Let the [concept_secret_service] do the work for us."

 sabotage_event.100.t: "Radicals seeking asylum"
 sabotage_event.100.d: "A delegation from [SCOPE.sCountry('delegation_sender_country').GetName] has arrived with an important message: local radicals are hiding in our country, they asked us to help them bring them back and face justice in [SCOPE.sCountry('delegation_sender_country').GetName]."
 sabotage_event.100.f: "In the wake of the recent explosion that hit the capital of [SCOPE.sCountry('delegation_sender_country').GetName] killing dozens, looks like some of the perpetrators decided to cross our border to seek asylum here. \n\n Either we consider them partisans or terrorist, if we decide to not extradate them, [SCOPE.sCountry('delegation_sender_country').GetName] is not going to like it."
 sabotage_event.100.a: "We won't shelter terrorists. Extradate them to [SCOPE.sCountry('delegation_sender_country').GetName]."
 sabotage_event.100.b: "Our borders, our laws."

# DELEGATION GETS REFUSED
sabotage_event.101.t: "Extradition Refused"
sabotage_event.101.d: "Our delegation returns empty handed. [SCOPE.sCountry('country_where_radicals_seek_refuge').GetName] has formally refused to extradite the #r radicals#! responsible for the bombing, choosing political convenience over justice."
sabotage_event.101.f: "Behind closed doors, sympathy and expediency speak louder than condemnation."
sabotage_event.101.a: "#r Terrorists#! protect their own."

# DELEGATION ACCEPTED – EXTRADITION GRANTED
sabotage_event.102.t: "Extradition Granted"
sabotage_event.102.d: "[SCOPE.sCountry('country_where_radicals_seek_refuge').GetName] has agreed to our request. The #r radicals#! responsible for the attack will be extradited and face justice under our laws."
sabotage_event.102.f: "In a dark age engulfed in suspicion and shadows, there are still shared values among rivals and so cooperation remains possible."
sabotage_event.102.a: "#g Justice#! will be served."

develop_nation_events.1.t: "A Promising Economy"
develop_nation_events.1.d: "With growing sentiment of #y friendship#! between us and [SCOPE.sCountry('send_economic_advisors_target').GetName], our advisors have started to consider a more #y focused involvement#! in the development of as a sovereign state. \n\nIf we commit to this we will have more options to boost [SCOPE.sCountry('send_economic_advisors_target').GetName]'s critical infrastructure and economy. Embark in this journey will come at a #r considerable cost#!."
develop_nation_events.1.f: ""
develop_nation_events.1.a: "[SCOPE.sCountry('send_economic_advisors_target').GetName]'s destiny lies in our hands."
develop_nation_events.1.b: "As of now we need to focus elsewhere."

develop_nation_events.1.t: "A Promising Economy"
develop_nation_events.1.d: "With the growing spirit of #y friendship#! between us and [SCOPE.sCountry('send_economic_advisors_target').GetName], our advisors are beginning to see an opportunity. A more #y direct and focused involvement#! in their development could help shape them into a stable and prosperous state. Should we commit to this path, we would gain broader means to strengthen their economy. In return, they would become #g deeply grateful#! perhaps even willing to join our sphere of influence. Still, nothing is guaranteed, and #r unforeseen challenges may yet arise#!."
develop_nation_events.1.f: "-Their factories are silent and their coffers thin- remarked the appointed advisor. -With our guidance, they could thrive. Without it… others will step in-."
develop_nation_events.1.a: "[SCOPE.sCountry('send_economic_advisors_target').GetName]'s destiny lies in our hands."
develop_nation_events.1.b: "Our attention must remain elsewhere, for now."

develop_nation_events.7.t: "The Price of Knowledge"
develop_nation_events.7.d: "Delegates from [SCOPE.sCountry('country_intel_buyer').GetName] have approached us with discreet inquiries regarding the results of our recent prospecting operations. They are prepared to make a generous offer, no questions asked, in exchange for full access to our findings."
develop_nation_events.7.f: "There will be a time in which information will travel faster than ore from the earth, and it will be far more valuable."
develop_nation_events.7.a: "Very well. Knowledge has its price."
develop_nation_events.7.b: "We are not interested."


develop_nation_events.99.t: "Investors Pulling Out"
develop_nation_events.99.d: "Political #red fervor and instability#! in the region has closed up the possibility to keep investing in [SCOPE.sCountry('ban_target').GetName]. We are retreating all assets and possibly wait for a better opportunity."
develop_nation_events.99.f: "When goods don't cross borders, soldiers will."
develop_nation_events.99.a: "That's a #r shame#!."

