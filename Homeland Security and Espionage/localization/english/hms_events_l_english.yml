 hms_je_build_nation_reason: "In order to build a solid nation out of this country we will need to invest in infrastructure and constructions. \n We can do so by starting a national project in the country. In order to gain reciprocal trust one project must either be #y started#! or #yellow completed#!. In addition to this #yellow Send Economic Advisors#! pact must remain enacted for the whole length. Removing this pact will cause our investors to quit."
 national_railway_project_bar_desc: "#yellow Expand Railway#! Progress"

 ban_railroad.1.t: "Engineers Dispatched"
 ban_railroad.1.d: "Our finest #yellow railway engineers#! have been dispatched to [SCOPE.sCountry('ban_target').GetName]. They will survey the terrain, plan optimal routes connecting major #yellow population centers#!, and begin preparations for the largest infrastructure project this nation has ever seen.\n\n The teams carry with them blueprints, surveying equipment, and the expertise needed to bring the iron horse to these lands."
 ban_railroad.1.f: "'Steel will cross rivers where ferries once failed' remarked the Chief Engineer before departure. 'Give us time, men and money and we will be back as those who brought wonders where there was once only rocks and stones.'"
 ban_railroad.1.a: "Where the rail goes, #yellow civilization#! follows."

 ban_railroad.2.t: "First Rail Lines Completed"
 ban_railroad.2.d: "Months of grueling work have yielded results, the first rail lines in [SCOPE.sCountry('ban_target').GetName] are now operational. Locomotives have begun their maiden journeys, connecting previously isolated towns to the wider economy.\n\n The local population watches in wonder as goods and people move at speeds previously unimaginable. Our engineers report that #yellow additional investment#! could significantly accelerate the remaining construction."
 ban_railroad.2.f: "At precisely dawn, the engine arrived at the newly built station to the cheers of hundreds. Children ran alongside the track, and elders crossed themselves as the machine screamed past. A vast cloud of steam covering the dim sunrays."
 ban_railroad.2.a: "We shall continue as planned."
 ban_railroad.2.b: "Invest more to #yellow accelerate#! construction."

 ban_railroad.3.t: "Tensions Among the Rail Workers"
 ban_railroad.3.d: "Construction crews working on the railroad expansion in [SCOPE.sCountry('ban_target').GetName] have grown restless. The backbreaking labor of blasting through hillsides, bridging ravines, and laying track in harsh conditions has taken its #r toll#!.\n\nThe workers petition for better wages and improved living conditions in the construction camps."
 ban_railroad.3.f: "'We don't fear the work'" one trackman was overheard saying, 'but we fear being buried beside it.' His companions nodded in grim agreement, unrest was growing among the workers, so many hours and so little pay..."
 ban_railroad.3.a: "Pay the men and give them some #g rest#!."
 ban_railroad.3.b: "This is the price of #yellow industrialization#!."

 ban_railroad.4.t: "National Railroad Complete"
 ban_railroad.4.d: "The railroad network in [SCOPE.sCountry('ban_target').GetName] is complete. A web of iron and steel now connects their major cities, ports, mining regions, and agricultural heartlands. Markets that were once isolated now trade freely, and the economic transformation is already visible.\n\nOur engineers return home seasoned by hardship and triumph alike, having left behind a nation irrevocably transformed."
 ban_railroad.4.f: "From coast to hinterland, the whistle of the locomotive heralds a new era. Distance has been defeated, the future is here and it arrived by rails.'"
 ban_railroad.4.a: "A monument of Engineering!"

 ban_railroad.10.t: "Bridge Collapse"
 ban_railroad.10.d: "#r Disaster#! has struck the railroad project in [SCOPE.sCountry('ban_target').GetName]. A partially completed bridge spanning a major river has collapsed during construction, sparkling a raging fire. Miraculously, there were no casualties besides 2 horses, the collapse occurred during a shift change but the setback is significant due to the lost equipment.\n\n Our chief engineer reports two options: an expensive emergency rebuild using reinforced designs, or a cheaper but slower reroute that avoids the river crossing entirely."
 ban_railroad.10.f: "The river, it seems, had other plans."
 ban_railroad.10.a: "Emergency rebuild, spare no expense."
 ban_railroad.10.b: "Redesign the route around the crossing."

 ban_railroad.11.t: "Landowners Block the Railway"
 ban_railroad.11.d: "A coalition of wealthy landowners in [SCOPE.sCountry('ban_target').GetName] has organized resistance against the planned rail route, which would cut directly through their most productive estates. We can either negotiate a generous compensation package to buy their cooperation, or invoke the authority of the state to force the route through regardless of their objections."
 ban_railroad.11.f: "So is true. #yellow Progress and property#! rights make uncomfortable bedfellows."
 ban_railroad.11.a: "Buy them out."
 ban_railroad.11.b: "Call in [SCOPE.sCountry('ban_target').GetName], let them deal with it."

 ban_railroad.12.t: "Miscalculated Steel Imports"
 ban_railroad.12.d: "Construction on the [SCOPE.sCountry('ban_target').GetName] railroad has ground to a halt. Our procurement officers report that the domestic steel supply has been exhausted every foundry is operating at capacity, and demand from the railroad project has outstripped what the local economy can produce.\n\n We can source steel from foreign markets at significantly inflated prices, or we can pause construction and wait for local production to catch up, though this will cost us months of progress."
 ban_railroad.12.f: "Fast. Cheap. Correct. Choose two."
 ban_railroad.12.a: "Import steel at premium prices."
 ban_railroad.12.b: "We will cover with our industries."

 ban_railroad.13.t: "Outbreak in the Construction Camps"
 ban_railroad.13.d: "A #r virulent outbreak#! has swept through the worker camps along the [SCOPE.sCountry('ban_target').GetName] railroad corridor. Dozens of laborers have fallen ill, and the misterious disease is spreading rapidly through the cramped, unsanitary conditions of the temporary settlements.\n\n We can fund a proper medical response, doctors, clean water supplies, and quarantine measures which will slow construction but #g save lives#!. Or we can press forward, #r replacing sick workers#! with new recruits, though the human cost and the anger it generates will be considerable."
 ban_railroad.13.f: "The price of progress is most often paid by those suffering in silence."
 ban_railroad.13.a: "Dispatch a medical team."
 ban_railroad.13.b: "The construction must continue. Recruit replacements."

 ban_railroad.20.t: "Foreign Engineers Offer Their Services"
 ban_railroad.20.d: "Word of our railroad project in [SCOPE.sCountry('ban_target').GetName] has spread through the engineering community abroad. A group of #yellow experienced railway engineers#!, veterans of major construction projects in Europe and the Americas, has offered to volunteer their expertise to our cause.\n\n Their knowledge of modern construction techniques, bridge design, and route optimization could prove invaluable. We may also consider hiring them on permanently to provide long-term technical support to our country when the project will be done."
 ban_railroad.20.f: "Engineers like to solve problems. If there are no problems handily available, they will create their own."
 ban_railroad.20.a: "Offer them #y short-time#! contracts"
 ban_railroad.20.b: "Offer them #yellow long-time#! contracts."
 ban_railroad.20.c: "Decline their help."
 short_time_contracts_engineers_tt: "We will hire them but just for this work alone."
 long_time_contracts_engineers_tt: "The Engineers will stick with us and join our country's open positions once we will be done with this project."
 extra_engineers_short_time_contract: "Extra Engineers with Short Term Contracts"
 extra_engineers_long_time_contract: "Extra Engineers with Long Term Contracts"

 ban_railroad.21.t: "Laborers Flock to the Railroad"
 ban_railroad.21.d: "News of well-paying construction work has traveled fast across [SCOPE.sCountry('ban_target').GetName]. Hundreds of unemployed laborers, displaced farmers, out-of-work artisans and former soldiers have gathered at construction sites, eager for a chance to earn a wage laying track.\n\n We can hire them all, dramatically increasing the pace of construction at a modest additional cost. Or we can be selective, hiring only the most capable workers to maintain quality while keeping expenses low."
 ban_railroad.21.f: "Where there is work, there are willing hands."
 ban_railroad.21.a: "Hire them all. Regardless of the cost."
 ban_railroad.21.b: "Hire selectively, quality over quantity."
 ban_railroad.21.c: "Offer them the minimum wage, with no extra expenses."

 # Event 22 localization missing for now, since it became a negative event (bridge collapsed)

 ban_railroad.23.t: "Local Capitalists Seek Partnership"
 ban_railroad.23.d: "A consortium of wealthy industrialists in [SCOPE.sCountry('ban_target').GetName] has approached us with a proposal: they wish to invest their own capital into the railroad in exchange for partial ownership of certain rail lines and preferential freight rates for their businesses.\n\n Accepting their investment would ease our #yellow financial burden#! and #yellow accelerate construction#!. We could also lose some of the later dividends coming from the project."
 ban_railroad.23.f: "#yellow Capital#! flows toward opportunity like water toward the sea."
 ban_railroad.23.a: "Accept the investment. Make it a #y shared#! ownership."
 ban_railroad.23.b: "Decline, the railroads belong to the people. #yellow And Us#!."
 var_capitalists_financing: "Added capitalists funds"
 














