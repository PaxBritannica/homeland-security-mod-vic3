 ban_survey.4.t: "Mineral Survey Complete"
 ban_survey.4.d: "The mineral survey of [SCOPE.sCountry('ban_target').GetName] has been completed. Our geologists have produced comprehensive maps detailing the location and estimated quantity of mineral resources across the country. During this time we have helped them boosting their mining outputs and discovering possible new resources."
 ban_survey.4.a: "Excellent work. The earth has revealed its secrets."

 ### Expedition Lost
 ban_survey.10.t: "Survey Expedition Goes Missing"
 ban_survey.10.d: "Contact has been lost with our geological survey team operating deep in the interior of [SCOPE.sCountry('ban_target').GetName]. The team was last reported heading into a remote mountain range to investigate promising rock formations. After some time still no word has come since.\n\n The terrain is #r rugged and unmapped#! they may simply be out of messenger range, or something worse may have happened. We can dispatch a well-equipped rescue party immediately, or trust that our experienced surveyors will find their way back on their own."
 ban_survey.10.f: "The wilderness does not suffer the unprepared."
 ban_survey.10.a: "Send our #y best explorers#!."
 ban_survey.10.b: "They're professionals, give them #y time#!."

 ### Hostile Locals
 ban_survey.11.t: "Hostile Locals"
 ban_survey.11.d: "Our survey teams in [SCOPE.sCountry('ban_target').GetName] have run into fierce resistance from local communities forcing us to call out for military escorts. In several areas, villagers have confronted our teams directly, demanding they leave.\n\nWe can attempt to win their cooperation by hiring locals as paid workers and guides, or we shall consider hiring more contractors for their safety."
 ban_survey.11.f: "The earth belongs to those who live upon it, or so they believe."
 ban_survey.11.a: "Hire locals as #yellow guides and workers#!."
 ban_survey.11.b: "Request more #y military personnel#!, the survey must continue."

 ### Equipment Failure
 ban_survey.12.t: "Surveying Instruments Destroyed"
 ban_survey.12.d: "#y Doretta#!, the pack mule carrying our primary surveying instruments: theodolites, barometers, mineral testing kits, lost its footing on a mountain trail in [SCOPE.sCountry('ban_target').GetName]. The equipment tumbled into a ravine and is beyond salvage.\n\nWithout proper instruments, the accuracy of our geological surveys will be severely compromised."
 ban_survey.12.f: "A geologist without his tools is merely a man staring at rocks."
 ban_survey.12.a: "Import replacement instruments."
 ban_survey.12.b: "Adapt. Improvise."

 ### Rival Claim
 ban_survey.13.t: "A Foreign Power Claims"
 ban_survey.13.d: "An unexpected diplomatic complication has arisen. [SCOPE.sCountry('rival_claim_country').GetName] is claiming pre-existing mineral exploration rights in several regions of [SCOPE.sCountry('ban_target').GetName] where our survey teams are currently operating. They demand we cease operations immediately or face diplomatic consequences.\n\nThis is almost certainly an opportunistic power play, but ignoring it could strain relations. We can settle the matter quietly with a financial payment, or reject the claim outright and continue our work."
 ban_survey.13.f: "The ground yields its riches; nations yield nothing."
 ban_survey.13.a: "Pay them off, settle this quietly."
 ban_survey.13.b: "Reject the claim, these rights are ours."

 ### Hot Spring Discovery
 ban_survey.20.t: "Geothermal Activity Detected"
 ban_survey.20.d: "Our surveyors in [SCOPE.sCountry('ban_target').GetName] have stumbled upon an area of significant geothermal activity: hot springs, steam vents, and mineral-rich water bubbling up from deep underground. The geological implications are #y exciting#!: such activity often indicates the presence of valuable mineral deposits in the surrounding rock formations.\n\n We can redirect few members of the survey team to investigate this area more closely while the others keep venturing elsewhere, or we could settle a camp here to gather important research data."
 ban_survey.20.f: "The earth itself speaks to those who listen."
 ban_survey.20.a: "The Main Survey has priority"
 ban_survey.20.b: "Establish a #yellow permanent research camp#!."
 ermanent_research_camp_modifier: "Settled Permanent Research Camp on Foreign Land"

 ### Local Prospector's Knowledge
 ban_survey.21.t: "An Old Prospector Offers His Secrets"
 ban_survey.21.d: "An elderly local prospector has approached our survey camp in [SCOPE.sCountry('ban_target').GetName]. Weathered by decades of wandering the hills and river beds, he claims to know the location of mineral deposits that no outsider has ever documented. His eyes are sharp despite his age, and the few samples he's brought are genuine. #yellow He'll share his knowledge for a price#!."
 ban_survey.21.f: "The land remembers, and so do its oldest sons."
 ban_survey.21.a: "We have no time to spare for local fools."
 ban_survey.21.b: "Hire the #yellow Old Man#!."
 we_cannot_guarantee_this_man_is_legit: "We cannot guarantee this man is legit."
 old_man_guidance_tt: "Old Man guidance"

