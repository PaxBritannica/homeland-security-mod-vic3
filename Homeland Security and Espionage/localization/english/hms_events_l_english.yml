 develop_nation_events.100.t: "A Nation Transformed"
 develop_nation_events.100.f: "Those who build nations shape the world."

 ### Dynamic descriptions based on target's bloc status

 develop_nation_events.100.d_unaligned: "Our #y monumental effort#! to develop [SCOPE.sCountry('ban_target').GetName] has reached its conclusion. Where once there was crumbling infrastructure, illiteracy, and untapped potential, there now stands a nation with modern infrastructure, all built with our money, our engineers, and our vision.\n\n [SCOPE.sCountry('ban_target').GetName] currently stands unaligned in the great power struggle. Given the extraordinary investment we have made in their future, it would be entirely reasonable to expect them to align with our interests. The question is how we wish to capitalize on this transformation."

 develop_nation_events.100.d_rival_bloc: "Our #y monumental effort#! to develop [SCOPE.sCountry('ban_target').GetName] has reached its conclusion. The transformation has been remarkable and yet, [SCOPE.sCountry('ban_target').GetName] remains a member of a rival power bloc, one that contributed nothing to their modernization.\nThis is an untenable situation. We poured our #yellow treasury and expertise#! into building their nation from the ground up. The least they can do is stand with those who made their prosperity possible. We could #yellow suport their growing demand for independence#! though this will certainly provoke a reaction from their current patron."

 develop_nation_events.100.d_our_bloc: "Our #y monumental effort#! to develop [SCOPE.sCountry('ban_target').GetName] has reached its conclusion. As a member of our power bloc, they were already aligned with our interests,but now that alignment runs deeper than mere politics. Their infrastructure, their institutions, their very economy bears our fingerprints.\n\nThis is an opportunity to solidify our influence and reap the rewards of our considerable investment."

 develop_nation_events.100.a_invite: "Invite [SCOPE.sCountry('ban_target').GetName] to join our power bloc."
 develop_nation_events.100.a_support_independentism: "Support [SCOPE.sCountry('ban_target').GetName]'s cause for #yellow independentism #!."
 develop_nation_events.100.b_obligation: "[SCOPE.sCountry('ban_target').GetName] owes us an #yellow Obligation#!."
 develop_nation_events.100.d_already_ours: "Tighten loyalty and #yellow economic bonds#!."
 develop_nation_events.100.c_economic: "We don't ask for nothing in return."

 ban_economic_dependency_funder: "Economic Patron"
 ban_economic_dependency_target: "Economic Dependency"

 develop_nation_events.101.t: "Our Influence is Undermined"
 develop_nation_events.101.d: "Our delegates have confirmed that a mission from [SCOPE.sCountry('ban_funder').GetName] has begun in [SCOPE.sCountry('ban_target').GetName], offering investments and promises of #yellow economic cooperation#!. Though presented as a gesture of goodwill, their involvement threatens to erode our standing and diminish our #red influence#! over [SCOPE.sCountry('ban_target').GetName]."
 develop_nation_events.101.f: "The foreign delegation has been received with notable enthusiasm. Public appearances have been few, and discussions largely private. The warmth of the welcome suggests that more than simple trade may be under negotiation."
 develop_nation_events.101.a: "[SCOPE.sCountry('ban_funder').GetName] can invest however they want."
 develop_nation_events.101.b: "Publicly denounce [SCOPE.sCountry('ban_funder').GetName]."

 develop_nation_events.102.t: "Crossing a Red Line"
 develop_nation_events.102.d: "[SCOPE.sCountry('ban_funder').GetName] has succesfully completed its #yellow investment campaign#! and is now demanding that [SCOPE.sCountry('ban_target').GetName] breaks free of our #yellow power bloc#!. The independentism campaign is already under way and this interference is about to generate a serious crysis if we do not act."
 develop_nation_events.102.f: "What we suspected was indeed true, and now we will have to consider what's ahead. We are on the verge of a serious diplomatic crysis that if not contained could lead to catastrofic consequences."
 develop_nation_events.102.a: "We must plan our next moves."

























