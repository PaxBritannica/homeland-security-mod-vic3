 ban_survey.1.t: "Survey Expedition Deployed"
 ban_survey.1.d: "A team of experienced geologists and prospectors has been dispatched into the interior of [SCOPE.sCountry('ban_target').GetName]. Armed with the latest surveying instruments and geological maps, they will systematically explore the country's terrain in search of #yellow valuable mineral deposits#!. \n\n The expedition will take months, traversing mountains, river valleys, and plains as they collect samples and map formations."
 ban_survey.1.f: "What lies beneath may reshape the fate of nations."
 ban_survey.1.a: "Report back with whatever you find."

 ### Survey Event 2: The Interim Report ###
 ban_survey.2.t: "The Interim Report"
 ban_survey.2.d: "Our geological survey team in [SCOPE.sCountry('ban_target').GetName] has reached a significant milestone. After months of painstaking fieldwork, collecting soil samples, mapping rock formations, and testing mineral compositions, they have produced a comprehensive interim report detailing their findings so far.\n\nThe data is promising. Our geologists have identified #yellow several areas of significant mineral potential#!, and the second phase of the survey could yield even more valuable results. However, the question now is not what lies beneath the ground, but rather what we do with this knowledge."
 ban_survey.2.f: "Knowledge is power and power must be wielded wisely."
 ban_survey.2.a: "Share the findings with [SCOPE.sCountry('ban_target').GetName]."
 ban_survey.2.b: "Keep the report #y classified#!, knowledge is leverage."
 ban_survey.2.c: "Expand the survey, our own geologists are learning too."

 ban_survey.3.t: "Discovery in the Field"
 ban_survey.3.d: "Exciting news from the survey expedition in [SCOPE.sCountry('ban_target').GetName] Our geologists have completed their analysis of the region's subsurface formations. The results are in, and they reveal the true extent of the country's mineral potential."
 ban_survey.3.a: "Significant mineral wealth confirmed!"

